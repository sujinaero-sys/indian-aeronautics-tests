<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GATE Student Login — Indian Aeronautics</title>

<link rel="icon" href="assets/logo.png">

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/style.css"
>

</head>


<body>


<div class="topbar">

  <a
    class="brand"
    href="index.html"
  >

    <img
      src="assets/logo.png"
      alt="Indian Aeronautics logo"
    >

    <span class="brand-name">
      INDIAN AERONAUTICS
    </span>

  </a>


  <a
    class="btn btn-outline"
    href="gate-mock-tests/index.html"
  >
    Back to GATE
  </a>

</div>


<div class="center-page">

  <div
    class="card narrow"
    style="width:100%;"
  >

    <h2 class="panel-title">
      GATE Student Login
    </h2>


    <p class="panel-sub">

      Login to access the
      GATE Aerospace Engineering
      mock-test series.

    </p>


    <div
      class="form-error"
      id="loginError"
    ></div>


    <form id="loginForm">


      <div class="field">

        <label for="loginId">
          GATE Student ID
        </label>

        <input
          type="text"
          id="loginId"
          autocomplete="username"
          placeholder="IA-GATE-00001"
          required
        >

      </div>


      <div class="field">

        <label for="loginPass">
          Password
        </label>

        <input
          type="password"
          id="loginPass"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary btn-block"
      >
        Log in
      </button>


    </form>


    <p class="small muted mt-24 text-center">

      Don't have a GATE account?

      <a href="gate-register.html">
        Create GATE account
      </a>

    </p>


    <p class="small muted mt-16 text-center">

      GATE Aerospace Engineering Mock Tests

    </p>


  </div>

</div>


<script src="js/gate-auth.js"></script>


<script>

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function (e) {

      e.preventDefault();


      const id =
        document
          .getElementById("loginId")
          .value
          .trim();


      const pass =
        document
          .getElementById("loginPass")
          .value;


      const errEl =
        document
          .getElementById("loginError");


      const submitBtn =
        e.target.querySelector(
          "button[type='submit']"
        );


      errEl.classList.remove("visible");
      errEl.textContent = "";


      submitBtn.disabled = true;
      submitBtn.textContent = "Checking login...";


      try {

        const result =
          await iaLogin(
            id,
            pass
          );


        console.log(
          "GATE LOGIN RESULT:",
          result
        );


        if (result.ok) {

          const returnTo =
            new URLSearchParams(
              window.location.search
            ).get("return");


          if (returnTo) {

            window.location.href =
              decodeURIComponent(
                returnTo
              );

          } else {

            window.location.href =
              "gate-mock-tests/index.html";

          }

          return;

        }


        errEl.classList.add("visible");


        if (
          result.reason === "already_used"
        ) {

          errEl.textContent =
            "This GATE login has already been used. Please contact your instructor.";

        }

        else if (
          result.reason === "server"
        ) {

          errEl.textContent =
            "Unable to connect to the GATE authentication service. Please try again.";

        }

        else {

          errEl.textContent =
            result.message ||
            "Invalid GATE Student ID or password.";

        }


      }

      catch (error) {

        console.error(
          "GATE LOGIN ERROR:",
          error
        );


        errEl.classList.add("visible");

        errEl.textContent =
          "Something went wrong while checking your GATE login.";

      }


      finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";

      }

    }
  );

</script>


</body>
</html>
