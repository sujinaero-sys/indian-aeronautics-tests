<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Student Login — Indian Aeronautics</title>

<link rel="icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/style.css"
>

</head>


<body>


<div class="topbar">

  <a
    class="brand"
    href="index.html"
  >

    <img
      src="assets/logo.png"
      alt="Indian Aeronautics logo"
    >

    <span class="brand-name">
      INDIAN AERONAUTICS
    </span>

  </a>


  <a
    class="btn btn-outline"
    href="index.html"
  >
    Back home
  </a>

</div>



<div class="center-page">

  <div
    class="card narrow"
    style="width:100%;"
  >

    <h2 class="panel-title">
      Student login
    </h2>


    <p class="panel-sub">
      Enter the student ID and password provided by Indian Aeronautics.
    </p>


    <div
      class="form-error"
      id="loginError"
    ></div>


    <form id="loginForm">


      <div class="field">

        <label for="loginId">
          Login ID
        </label>

        <input
          type="text"
          id="loginId"
          autocomplete="username"
          placeholder="IA-STUDENT-001"
          required
        >

      </div>



      <div class="field">

        <label for="loginPass">
          Password
        </label>

        <input
          type="password"
          id="loginPass"
          autocomplete="current-password"
          required
        >

      </div>



      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="loginButton"
      >
        Log in
      </button>


    </form>


    <p class="small muted mt-24 text-center">

      Need access?

      <a
        id="waLoginLink"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Contact us on WhatsApp
      </a>

    </p>


  </div>

</div>



<script src="js/auth.js"></script>


<script>

const WA_NUMBER =
  "919995863184";


document.getElementById(
  "waLoginLink"
).href =
  `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(
    "Hi, I'd like access to the Indian Aeronautics mock tests."
  )}`;



document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const id =
        document
          .getElementById("loginId")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPass")
          .value;


      const errorBox =
        document.getElementById(
          "loginError"
        );


      const button =
        document.getElementById(
          "loginButton"
        );


      errorBox.classList.remove(
        "visible"
      );

      errorBox.textContent = "";


      button.disabled = true;

      button.textContent =
        "Checking login...";


      try {

        const result =
          await iaLogin(
            id,
            password
          );


        console.log(
          "LOGIN FORM RESULT:",
          result
        );


        if (!result.ok) {

          errorBox.classList.add(
            "visible"
          );


          if (
            result.reason ===
            "already_used"
          ) {

            errorBox.textContent =
              "This login has already been used to complete a test on this device.";

          }

          else if (
            result.reason ===
            "server"
          ) {

            errorBox.textContent =
              "Unable to connect to the login service. Please try again.";

          }

          else {

            errorBox.textContent =
              result.message ||
              "Invalid student ID or password.";

          }


          return;

        }


        /*
         * Successful login.
         */

        const access =
          iaGetAccess();


        /*
         * If the student arrived from
         * a protected ISRO page, return there
         * only if the student has ISRO access.
         */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const returnTo =
          params.get("return");


        if (
          returnTo &&
          access !== "NONE"
        ) {

          const decoded =
            decodeURIComponent(
              returnTo
            );


          /*
           * Prevent external redirects.
           */

          if (
            decoded.startsWith("/") &&
            !decoded.startsWith("//")
          ) {

            /*
             * ISRO destination
             */

            if (
              decoded.includes(
                "/isro-mock-tests/"
              )
            ) {

              if (
                access === "ISRO" ||
                access === "BOTH"
              ) {

                window.location.href =
                  decoded;

                return;

              }

            }


            /*
             * HAL destination
             */

            if (
              decoded.includes(
                "/portal.html"
              )
            ) {

              if (
                access === "HAL" ||
                access === "BOTH"
              ) {

                window.location.href =
                  decoded;

                return;

              }

            }

          }

        }


        /*
         * Normal login routing.
         *
         * IMPORTANT:
         * If the student came from a protected series
         * but does not have access to that series,
         * DO NOT fall through to another portal.
         */

        if (
          returnTo &&
          access !== "NONE"
        ) {

          const decoded =
            decodeURIComponent(
              returnTo
            );


          /*
           * Student requested ISRO,
           * but does not have ISRO access.
           */

          if (
            decoded.includes(
              "/isro-mock-tests/"
            ) &&
            access === "HAL"
          ) {

            errorBox.classList.add(
              "visible"
            );

            errorBox.textContent =
              "Your account has HAL access only. This account does not include ISRO Mock Tests.";

            return;

          }


          /*
           * Student requested HAL,
           * but does not have HAL access.
           */

          if (
            decoded.includes(
              "/portal.html"
            ) &&
            access === "ISRO"
          ) {

            errorBox.classList.add(
              "visible"
            );

            errorBox.textContent =
              "Your account has ISRO access only. This account does not include HAL Mock Tests.";

            return;

          }

        }


        /*
         * Normal login routing when
         * there is no protected return
         * destination.
         */

        if (
          access === "HAL"
        ) {

          window.location.href =
            "portal.html";

          return;

        }


        if (
          access === "ISRO"
        ) {

          window.location.href =
            "isro-mock-tests/";

          return;

        }


        if (
          access === "BOTH"
        ) {

          window.location.href =
            "access.html";

          return;

        }


        errorBox.classList.add(
          "visible"
        );

        errorBox.textContent =
          "Your account has no active mock-test package. Please contact us on WhatsApp.";

        sessionStorage.removeItem(
          IA_SESSION_KEY
        );

      }


      catch(error) {

        console.error(
          "LOGIN FORM ERROR:",
          error
        );


        errorBox.classList.add(
          "visible"
        );

        errorBox.textContent =
          "Something went wrong while checking your login.";

      }


      finally {

        button.disabled = false;

        button.textContent =
          "Log in";

      }

    }
  );

</script>


</body>
</html>
