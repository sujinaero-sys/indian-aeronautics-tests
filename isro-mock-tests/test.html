<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
ISRO Mock Test
</title>

<link
  rel="stylesheet"
  href="assets/style.css"
>

</head>


<body>


<div
  class="quiz-shell"
  id="app"
>

  <p style="font-family:var(--font-mono); color:var(--paper-dim);">
    Checking student access...
  </p>

</div>



<script src="../js/auth.js"></script>


<script>

const session =
  iaRequireAccess(
    "ISRO",
    "../login.html?return=" +
    encodeURIComponent(
      window.location.pathname
    )
  );


if (session) {

  const quizScript =
    document.createElement(
      "script"
    );

  quizScript.src =
    "assets/quiz.js";

  document.body.appendChild(
    quizScript
  );

}

</script>


</body>
</html>
